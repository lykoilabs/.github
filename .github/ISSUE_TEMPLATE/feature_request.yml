name: Feature or design proposal
description: Propose a capability or question a design decision.
title: "[proposal]: "
labels: ["proposal", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Architecture decisions are recorded in each repository's `docs/adr/`.
        If your proposal contradicts an accepted ADR, say which one and why;
        that is the most useful kind of proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, or what costs too much. Concrete scenarios beat abstractions.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. Sketch the API, protocol or topology if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it and why they are worse.
  - type: input
    id: adr
    attributes:
      label: Related ADR
      placeholder: e.g. 0005-budgeted-interest-management
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This proposal does not depend on any game client material or copyleft-derived code.
          required: true
