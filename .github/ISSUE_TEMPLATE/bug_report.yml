name: Bug report
description: Something does not work as documented.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** include any game client
        material (packet captures, dumped opcode tables, keys, decompiled
        code) — see CONTRIBUTING.md. Security issues go to
        security@lykoilabs.dev, not here.
  - type: input
    id: component
    attributes:
      label: Crate or binary
      description: e.g. `tenshu-sim 0.3.1`, `sekisho` at commit abc1234
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture, Rust toolchain if building from source
      placeholder: Ubuntu 24.04 x86_64, rustc 1.9x
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you observed, what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, config or a failing test. The smaller the better.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs and metrics
      description: Relevant `tracing` output, panics, tick-budget metrics. Trim unrelated noise.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no game client material or copyleft-derived code.
          required: true
